pattern: Page Layout

description: >
  Defines the default structure for page-level layouts, including viewport padding,
  container width and vertical spacing between major sections.

purpose:
  - Provide a consistent page structure.
  - Keep content aligned to readable container widths.
  - Support responsive layout behaviour.
  - Prevent arbitrary page spacing in AI-generated designs.
  - Explain when and why responsive layout tokens should be used.

tokens:
  surface:
    canvas: color.surface.canvas

  breakpoints:
    sm:
      token: breakpoint.sm
      approximateValue: 40rem / 640px
      purpose: Small viewport threshold. Used when layout rules need to change beyond the smallest layout.
    md:
      token: breakpoint.md
      approximateValue: 48rem / 768px
      purpose: Medium viewport threshold. Used when the page can support more padding, wider layouts or more spacious section rhythm.
    lg:
      token: breakpoint.lg
      approximateValue: 64rem / 1024px
      purpose: Large viewport threshold. Used when desktop-style layout rules are appropriate.
    xl:
      token: breakpoint.xl
      approximateValue: 80rem / 1280px
      purpose: Extra-large viewport threshold. Used for wide layouts where additional horizontal space is available.
    2xl:
      token: breakpoint.2xl
      approximateValue: 96rem / 1536px
      purpose: Very wide viewport threshold. Used sparingly for complex or wide layouts.

  pagePadding:
    base:
      token: layout.page.padding.base
      appliesUntil: breakpoint.md
      purpose: Provides safe spacing between the viewport edge and content on the smallest layouts.
    md:
      token: layout.page.padding.md
      appliesFrom: breakpoint.md
      purpose: Increases page breathing room once the viewport can support more horizontal space.
    lg:
      token: layout.page.padding.lg
      appliesFrom: breakpoint.lg
      purpose: Provides stronger desktop page framing and prevents content from feeling cramped on larger viewports.

  containerMaxWidth:
    text:
      token: layout.container.maxWidth.text
      purpose: Limits long-form prose to a readable line length.
      useFor:
        - Long-form text
        - Articles
        - Documentation body copy
        - Forms with explanatory content
    narrow:
      token: layout.container.maxWidth.narrow
      purpose: Provides a focused width for constrained content.
      useFor:
        - Forms
        - Dialog-style layouts
        - Focused tasks
    default:
      token: layout.container.maxWidth.default
      purpose: Provides the standard maximum width for most page layouts.
      useFor:
        - Standard content pages
        - Documentation pages
        - Mixed text and component examples
    wide:
      token: layout.container.maxWidth.wide
      purpose: Allows wider content while still preventing uncontrolled full-width layouts.
      useFor:
        - Dashboards
        - Complex grids
        - Data-heavy layouts
        - Multi-column layouts

  sectionSpacing:
    base:
      token: spacing.section.base
      appliesUntil: breakpoint.md
      purpose: Provides clear separation between major sections on smaller layouts without wasting vertical space.
    md:
      token: spacing.section.md
      appliesFrom: breakpoint.md
      purpose: Increases separation between major sections as screen space becomes more available.
    lg:
      token: spacing.section.lg
      appliesFrom: breakpoint.lg
      purpose: Provides generous section rhythm for desktop layouts and documentation pages.

structure:
  - Page uses color.surface.canvas as the background.
  - Page content is inset from viewport edges using layout.page.padding tokens.
  - Main content should be horizontally centred inside a container.
  - Standard pages should use layout.container.maxWidth.default.
  - Text-heavy pages should use layout.container.maxWidth.text.
  - Wide or complex pages may use layout.container.maxWidth.wide.
  - Major sections should be separated using spacing.section tokens.
  - Breakpoint tokens define when layout behaviour changes; they are not fixed page widths.

responsiveBehaviour:
  - Use base layout tokens below breakpoint.md.
  - Use md layout tokens from breakpoint.md and above.
  - Use lg layout tokens from breakpoint.lg and above.
  - Do not assume breakpoint names map directly to devices.
  - Do not use breakpoint tokens as frame widths.
  - Use realistic viewport widths for testing, then apply the appropriate responsive tokens inside those frames.

viewportExamples:
  smallViewport:
    exampleWidth: 390px
    applicableRule: Below breakpoint.md.
    pagePadding: layout.page.padding.base
    sectionSpacing: spacing.section.base
    containerMaxWidth: Fill available width, constrained by page padding.
  mediumViewport:
    exampleWidth: 768px
    applicableRule: At or above breakpoint.md.
    pagePadding: layout.page.padding.md
    sectionSpacing: spacing.section.md
    containerMaxWidth: layout.container.maxWidth.default where space allows.
  largeViewport:
    exampleWidth: 1440px
    applicableRule: At or above breakpoint.lg.
    pagePadding: layout.page.padding.lg
    sectionSpacing: spacing.section.lg
    containerMaxWidth: layout.container.maxWidth.default for standard pages.

accessibility:
  - Maintain readable line lengths for text-heavy content.
  - Avoid edge-to-edge text on small viewports.
  - Ensure layout spacing supports visual grouping and scanning.
  - Use layout.container.maxWidth.text for long-form prose.
  - Use section spacing to make page structure easier to understand.
  - Do not rely on visual position alone to communicate hierarchy.

aiGenerationRules:
  - Use this pattern for standard page layouts.
  - Do not invent page padding values.
  - Do not invent section spacing values.
  - Do not use breakpoint tokens as static frame widths.
  - Use breakpoint tokens only to decide when layout behaviour changes.
  - Use layout.page.padding.base below breakpoint.md.
  - Use layout.page.padding.md from breakpoint.md.
  - Use layout.page.padding.lg from breakpoint.lg.
  - Use spacing.section.base below breakpoint.md.
  - Use spacing.section.md from breakpoint.md.
  - Use spacing.section.lg from breakpoint.lg.
  - Use layout.container.maxWidth.default for standard page content.
  - Use layout.container.maxWidth.text for long-form prose.
  - Do not exceed layout.container.maxWidth.wide for main content.