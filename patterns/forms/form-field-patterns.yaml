accessibility:
  - Every control must have an accessible name.
  - Visible labels should be used unless there is a documented reason not to.
  - Placeholder text must not be used as a label.
  - Individual controls must use labels.
  - Related groups of controls must use fieldset and legend.
  - Helper text must be associated using aria-describedby.
  - Shared Fieldset error text must follow errorAssociation, which defaults to group and allows children for identified affected visible, enabled children.
  - Invalid controls should use aria-invalid="true".
  - A Fieldset never receives aria-invalid.
  - In children mode, only affected children reference the one shared error and receive aria-invalid="true"; unaffected children remain neutral.
  - The same shared error must never be associated with both a Fieldset and children.
  - Inline errors must be shown beside invalid fields or groups.
  - A failed submit with one or more user-correctable validation errors must use an error summary.
  - Focus must be visible.
  - Disabled and read-only states must be distinct.
  - Required or optional status must not rely on colour alone.
  - Error state must not rely on colour alone.
  - Relevant fields should document type, inputmode and autocomplete.

figmaRules:
  - Use semantic form tokens.
  - Ordinary inline field and group errors use form.error typography and colour only; do not automatically apply form.error.background without an explicitly defined filled error surface or container.
  - Do not use raw colour, spacing, radius or typography values.
  - Use the single control pattern for one field answering one question.
  - Use the grouped control pattern for groups answering one shared question.
  - Use label components for individual controls.
  - Use legend styling for grouped controls.
  - Use helper text only when it helps users answer correctly.
  - Use consistent inline error placement.
  - Keep exactly one visible shared Fieldset error after helper text and before consumer content in both errorAssociation modes.
  - Do not infer accessible error ownership from visual placement inside a Fieldset.
  - For new compound fieldset-based Figma components, use the canonical nonvariant _Fieldset/Header primitive defined in components/fieldset/fieldset.yaml.
  - Use the exact _Fieldset/Header anatomy Legend, Helper and Error.
  - Keep _Fieldset/Header and consumer content as siblings.
  - _Fieldset/Header exposes only Legend text, Helper text, Helper text content and Error text.
  - Do not expose Content, State, Requirement, Legend style, Error visible or errorAssociation on _Fieldset/Header.
  - Preserve the existing public Fieldset component, API, defaults and structure as the compatibility bridge; do not rebuild it around _Fieldset/Header in this change.
  - The current public Fieldset has two production masters; do not describe it as 30 existing masters or expand the two into a 30-master Cartesian matrix.
  - Treat errorAssociation as runtime and semantic handoff metadata, not a Figma property or variant.
  - Show both error and focus states when a field is focused and invalid.
  - Do not create a visual-only required or optional indicator.
  - For Checkbox, use one visible Label text layer containing the complete labelText; do not create an optional property or separate Optional-marker layer.
  - For Checkbox, let Label fill the available Option-content width with automatic height and natural wrapping; do not set an arbitrary fixed width or max width.
  - Do not use disabled styling for read-only fields.

aiGenerationRules:
  - Do not create form controls without an accessible name.
  - Use visible labels by default.
  - Do not use placeholder text as a label.
  - Do not treat labels and legends as interchangeable.
  - Use fieldset and legend for related groups of controls.
  - Associate Fieldset helper text with the Fieldset using aria-describedby in generated code.
  - Default shared Fieldset errors to errorAssociation group.
  - Use errorAssociation children only when a consuming composite identifies one or more affected visible, enabled children.
  - In children mode, keep the shared error off the Fieldset and unaffected children; add it and aria-invalid="true" only to affected children.
  - Never apply aria-invalid to a Fieldset or associate the same shared error with both Fieldset and children.
  - Generate exactly one visible shared error after helper text and before consumer content.
  - A code-level Header abstraction must emit a fragment or direct children so the native legend remains the Fieldset's first direct child.
  - Use aria-invalid="true" on invalid controls.
  - Use an error summary after a failed submit with one or more user-correctable validation errors.
  - Keep inline errors even when an error summary is present.
  - Move focus to the error summary exactly once after the summary and inline errors render.
  - Do not refocus the error summary on validation rerenders; focus it once again after a later failed submit.
  - Sort summary items by form document order and remove duplicate items.
  - 'Prefix the existing document title once with "Error: " while the submitted page has errors.'
  - Do not move focus while the user is typing.
  - Do not use type="number" for identifiers or structured text values.
  - Use documented semantic tokens rather than raw values.
  - Report missing token needs rather than inventing new raw values.
  - For Checkbox, include optional wording within the complete labelText instead of generating an optional property or separate marker layer.
  - Do not invent form field variants outside the documented pattern.
