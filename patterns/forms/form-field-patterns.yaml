pattern: Form Field Patterns
version: 1.0.0
status: draft

description: >
  Defines shared form field behaviour, accessibility rules and AI generation
  constraints for individual controls, grouped controls, labels, legends,
  helper text, validation, error summaries, disabled states, read-only states
  and input attributes.

purpose:
  - Provide a shared contract for accessible form fields.
  - Support consistent form field generation by humans and AI.
  - Prevent inconsistent labelling, validation and error handling across components.
  - Define the difference between individual controls and grouped controls.
  - Ensure form components consume shared semantic form tokens.

sourceDocumentation:
  humanReadable:
    - patterns/forms/README.md
    - patterns/forms/form-field-patterns.md
    - patterns/forms/single-control-pattern.md
    - patterns/forms/grouped-control-pattern.md
    - patterns/forms/labels.md
    - patterns/forms/legends-and-fieldsets.md
    - patterns/forms/helper-text.md
    - patterns/forms/required-and-optional.md
    - patterns/forms/validation-and-errors.md
    - patterns/forms/error-summary.md
    - patterns/forms/focus-management.md
    - patterns/forms/disabled-and-readonly.md
    - patterns/forms/input-types-and-keyboards.md
    - patterns/forms/accessibility-checklist.md
    - patterns/forms/tokens.md

relatedPatterns:
  - patterns/form-layout.yaml

scope:
  includes:
    - Text input
    - Textarea
    - Select
    - Search input
    - Password input
    - Currency input
    - Stepper
    - Single checkbox
    - Radio group
    - Checkbox group
    - Date of birth
    - Address group
    - Multi-part questions
    - Error summary
  excludes:
    - Full page layout
    - Form submission business logic
    - Server-side validation rules
    - Complex conditional form flows
    - Component-specific visual variants

corePrinciples:
  - Every form control must have an accessible name.
  - Visible labels are the default and preferred pattern.
  - Helper text is optional.
  - Placeholder text must not be used as a label.
  - Labels and legends are not interchangeable.
  - Labels identify individual controls.
  - Legends identify groups of related controls inside a fieldset.
  - Errors must be available visually and programmatically.
  - Visual error placement does not by itself determine accessible ownership.
  - A Fieldset helper remains associated with the group while a shared error follows the Fieldset errorAssociation contract.
  - Never associate the same shared error with both a Fieldset and its children.
  - Never apply aria-invalid to a Fieldset.
  - Error states must not rely on colour alone.
  - Required and optional status must be communicated consistently.
  - Disabled and read-only fields must be distinct.

patterns:
  singleControl:
    description: >
      Use when one form control answers one question.
    appliesTo:
      - text-input
      - textarea
      - select
      - search-input
      - password-input
      - currency-input
      - stepper
      - single-checkbox
    anatomy:
      - label
      - helperText
      - errorMessage
      - control
    order:
      - label
      - helperText
      - errorMessage
      - control
    orderScope:
      - text-input
      - textarea
      - select
      - search-input
      - password-input
      - currency-input
      - stepper
    orderExceptions:
      standaloneCheckbox:
        appliesTo:
          - single-checkbox
        overridesDefaultOrder: true
        terminology:
          checkboxRoot: Checkbox root
          optionRow: Option row
          visualControl: Visual control
          optionContent: Option content
          label: Label
          description: Description
          individualError: Error message
          fieldsetGroupError: Fieldset group error
        figmaVisualStructure:
          checkboxRoot:
            - optionRow
            - individualError
          optionRow:
            - visualControl
            - optionContent
          optionContent:
            - label
            - optionalCheckboxSpecificDescription
        semanticImplementation:
          nativeCheckboxInputOwner: checkbox
          nativeInputAssociatedWith: completeVisibleLabel
          descriptionAssociation: aria-describedby
          individualErrorAssociation: aria-describedby
        optionalNodes:
          - optionalCheckboxSpecificDescription
          - individualError
        order:
          - optionRow
          - individualError
        rules:
          - The Checkbox root contains the complete option row followed by any individual error.
          - The Figma visual Option row contains the Visual control and Option content.
          - The semantic implementation retains a native Checkbox input associated with the complete visible label.
          - An optional Checkbox-specific description belongs with the option content but remains outside the HTML label.
          - The individual error follows the complete option row and remains outside the associated label.
          - Figma uses one visible Label text layer that fills the available Option-content width and uses automatic height.
          - Label has no arbitrary fixed width or max width and wraps naturally within the Checkbox root.
          - Optional wording is authored within the complete labelText and wraps in the same text flow.
          - Do not create a Label row, Optional-marker layer or optional-status column.
          - Option content fills the remaining width and the visual control aligns with the first line.
          - Description and individual Error wrap independently.
          - The complete Checkbox must reflow within a 320px-wide container.
          - This exception does not change the normal error ordering for Text Input, Textarea, Select or similar single controls.
          - A whole-group Checkbox error uses errorAssociation group and is not an individual Checkbox error.
    rules:
      - A visible label is required by default.
      - The label must be associated with the control.
      - Helper text is optional.
      - Helper text must be associated with the control when present.
      - Error text must be associated with the control when present.
      - Invalid controls must use aria-invalid="true".
      - Placeholder text must not be used as the label.
      - A standalone single checkbox may own an individual error only when that checkbox is independently validated.
      - Native single checkboxes submit their name and value only when checked.
      - Consuming applications must handle the absent submitted name and value for unchecked checkboxes.
    requiredImplementation:
      accessibleName: true
      visibleLabelDefault: true
      describedByForHelper: true
      describedByForError: true
      ariaInvalidWhenInvalid: true

  groupedControl:
    description: >
      Use when several controls answer one shared question.
    appliesTo:
      - fieldset
      - radio-group
      - checkbox-group
      - date-of-birth
      - address-group
      - multi-part-question
    anatomy:
      - fieldset
      - legend
      - groupHelperText
      - groupErrorMessage
      - contentSlot
    terminology:
      groupHeader: >
        Internal Figma layout region containing the legend, optional group helper
        text and optional group error before the content slot. It is not additional
        public HTML anatomy or a runtime wrapper.
      contentSlot: >
        Generic slot for controls or grouped components that answer the shared
        legend question. Earlier references to relatedControls are equivalent.
      groupErrorMessage: >
        Established anatomy name for the one shared visible error in the Group
        header. The name and visual placement do not determine accessible ownership.
      errorAssociation: >
        Runtime choice between Fieldset ownership and association with identified
        affected visible, enabled children. The authoritative contract is the
        errorAssociation section in components/fieldset/fieldset.yaml.
    order:
      - legend
      - groupHelperText
      - groupErrorMessage
      - contentSlot
    rules:
      - Use a native fieldset and legend when several controls answer one shared question.
      - Fieldset is the semantic grouping primitive for grouped controls.
      - The native legend must be the first direct child of the fieldset.
      - The legend describes the whole group.
      - Each child control may still need its own label.
      - Group helper text should be associated with the fieldset using aria-describedby.
      - errorAssociation group is the default and associates the one shared error with the fieldset using aria-describedby.
      - An error concerning the complete group, including a whole-group required failure, uses errorAssociation group.
      - A consuming composite may use errorAssociation children when it identifies one or more affected visible, enabled children.
      - In children mode, only affected children reference the one shared error and receive aria-invalid="true".
      - In children mode, the fieldset continues to reference helper text when present and excludes the shared error.
      - Unaffected children remain neutral in children mode.
      - Never apply aria-invalid to the fieldset.
      - Never associate the same shared error with both the fieldset and children.
      - When group association includes both helper and error text, list the helper ID before the error ID in the fieldset's aria-describedby.
      - Child-field errors should be associated with the specific invalid child field.
      - Summary links target the first relevant visible, enabled interactive child, not the non-focusable fieldset.
      - On activation, scroll the legend into view and move focus to that child.
      - Preserve the selected inline error association without changing ownership merely to support summary-link focus.
      - Do not make the fieldset focusable.
      - Do not add role="group" to the native fieldset.
      - Do not use fieldset as a generic layout container.
      - Use native disabled fieldset behaviour only when the whole group is unavailable.
      - Treat legend, group helper text and group error as the Group header for layout.
      - Keep exactly one visible shared error after helper text and before the content slot in both association modes.
      - Do not infer accessible error ownership from placement inside the Group header.
      - Separate the Group header from the content slot with form.group.gap.headerToContent.
      - Keep form.group.gap.betweenOptions and form.group.gap.betweenFields for spacing inside the content slot.
      - Use form.field.gap.controlToNextField only after the complete Fieldset when the next form field begins.
      - For checkbox groups, minimum, maximum and exact selection rules are group-level validation owned by Fieldset.
      - Do not put required on one arbitrary checkbox as a shortcut for "select at least one".
    errorAssociation:
      source:
        component: components/fieldset/fieldset.yaml
        section: errorAssociation
      type: enum
      default: group
      allowed:
        - group
        - children
      figmaProperty: false
      ownershipSummary:
        group: fieldset
        children: affected-visible-enabled-children
      rules:
        - Follow the authoritative Fieldset contract for complete aria-describedby, aria-invalid and visual-placement invariants.
        - Group helper text remains associated with the fieldset in both modes.
        - A whole-group required failure remains group-associated.
    runtimeStructure:
      source:
        component: components/fieldset/fieldset.yaml
        section: runtimeStructure
      root: nativeFieldset
      directChildrenOrder:
        - nativeLegendAsFirstDirectChild
        - optionalGroupHelperText
        - optionalSharedError
        - consumerControls
      headerCodeShape: fragment-or-direct-children
      rules:
        - Preserve native fieldset and legend semantics.
        - A code-level Header abstraction must not wrap legend, helper and error in an extra element.
        - After fragment expansion, legend, helper, error and consumer controls are siblings inside fieldset.
        - Keep Header and consumer content as siblings in compound Figma components.
    layout:
      groupHeader:
        contains:
          - legend
          - groupHelperText
          - groupErrorMessage
        publicHtmlAnatomy: false
        rules:
          - The DOM and semantic order remains legend, helper text, group error and related controls.
          - Use form.field.gap.labelToHelper between Legend and group helper text.
          - Use form.field.gap.helperToError between group helper text and group error.
          - Optional helper and error content collapses without empty spacing.
      headerToContent:
        token: form.group.gap.headerToContent
        appliesBetween:
          - groupHeader
          - contentSlot
        rules:
          - Use this gap whether the Group header ends with Legend, helper text or group error.
          - Use the same gap in default and error states.
          - Do not use form.field.gap.errorToControl for grouped-control header-to-content spacing.
          - Do not use form.field.gap.controlToNextField for internal Fieldset spacing.
      contentSlot:
        rules:
          - Child controls or grouped components own their internal layout.
          - Use form.group.gap.betweenOptions between related options where the child component needs option spacing.
          - Use form.group.gap.betweenFields between child fields where the child component needs field spacing.
    requiredImplementation:
      nativeFieldset: true
      nativeLegend: true
      legendFirstDirectChild: true
      groupAccessibleName: true
      childLabelsPreserved: true
      describedByForGroupHelper: true
      describedByForSharedErrorByAssociationMode: true
      affectedChildrenAriaInvalidInChildrenMode: true
      fieldsetAriaInvalid: false
      singleSharedErrorOwner: true
      contentRelatedToLegend: true

labels:
  purpose: Identify individual form controls.
  defaultVisibility: visible
  allowedVisibility:
    visible:
      preference: 1
      rule: Use for most form controls.
    visuallyHidden:
      preference: 2
      rule: >
        Use only when visible context already makes the purpose clear and
        showing a visible label would create unnecessary repetition.
    ariaLabelledby:
      preference: 3
      rule: >
        Use when visible text elsewhere labels the control.
    ariaLabel:
      preference: 4
      rule: >
        Use only as a last resort when there is no practical visible label
        and no suitable visible text to reference.
  rules:
    - Every control must have an accessible name.
    - If visible label text exists, the accessible name should include the visible text.
    - Do not use placeholder text as the label.
    - Do not use aria-label when a visible label can be used.

legends:
  purpose: Identify a group of related controls inside a fieldset.
  rules:
    - Use a legend for a fieldset.
    - The legend must be the first direct child of the fieldset.
    - Do not use a legend for a standalone control.
    - Do not use a label as a substitute for a group legend.
    - Do not use a legend as a substitute for every child label.
    - Keep the legend visible by default.
    - Do not put interactive content inside the legend.
    - Legends may have different visual sizes depending on context.
    - Legend typography variants must not change the semantic purpose of the legend.
    - Semantic heading level and visual legend style are separate decisions.
    - A legend may contain one heading element when the grouped question genuinely participates in the document heading structure.
    - Allowed semantic heading levels are none and h1 through h6.
    - Do not choose a heading level only for visual size.
    - Do not duplicate identical text in a separate heading before the fieldset and in the legend.
  typographyVariants:
    page:
      tokens:
        base: form.legend.typography.page.base
        md: form.legend.typography.page.md
        lg: form.legend.typography.page.lg
      use: Grouped question that is also the page heading.
      visualMapping: H1-aligned responsive typography.
    default:
      tokens:
        base: form.legend.typography.default.base
        md: form.legend.typography.default.md
        lg: form.legend.typography.default.lg
      use: Plain default legend or grouped question directly beneath the page heading.
      visualMapping: H2-aligned responsive typography.
    section:
      tokens:
        base: form.legend.typography.section.base
        md: form.legend.typography.section.md
        lg: form.legend.typography.section.lg
      use: Grouped question inside a larger H2-level section.
      visualMapping: H3-aligned responsive typography.
    subsection:
      tokens:
        base: form.legend.typography.subsection.base
        md: form.legend.typography.subsection.md
        lg: form.legend.typography.subsection.lg
      use: Grouped question inside a larger H3-level subsection.
      visualMapping: H4-aligned responsive typography.
    compact:
      tokens:
        base: form.legend.typography.compact.base
        md: form.legend.typography.compact.md
        lg: form.legend.typography.compact.lg
      use: Dense grouped controls such as filters, cards or settings panels.
      visualMapping: Responsive form-label typography.
  headingBehaviour:
    default: none
    allowed:
      - none
      - h1
      - h2
      - h3
      - h4
      - h5
      - h6
    recommendedPairings:
      page: h1
      default: h2 or none
      section: h3
      subsection: h4
      compact: none

helperText:
  required: false
  rules:
    - Helper text is optional.
    - Use helper text only when it helps users answer correctly.
    - Helper text should sit between the label or legend and the control.
    - Helper text should be short.
    - Helper text must be associated with the control or group using aria-describedby.
    - For grouped controls, group helper text appears after the legend and before any shared error.
    - For grouped controls, give group helper text a stable ID and reference it from the fieldset.
    - When errorAssociation is group and group helper text and a shared error are both present, put the helper ID before the error ID in the fieldset's aria-describedby.
    - When errorAssociation is children, keep only the helper ID on the fieldset and associate the shared error with affected children.
    - Do not automatically repeat group helper text on every child control.
    - Helper text must not repeat the label.
    - Helper text must not replace the label.
  goodUses:
    - Format guidance
    - Where to find information
    - How the answer will be used
    - Clarifying a confusing label
    - Constraints users should know before answering
  avoid:
    - Repeating the label
    - Replacing the label
    - Long instructions
    - Critical validation that only appears after an error
    - Placeholder text as helper text

requiredAndOptional:
  defaultAssumption: requiredUnlessMarkedOptional
  optionalMarker:
    text: "(optional)"
    location:
      - label
      - legend
  rules:
    - Use “(optional)” in the label or legend when a field is optional.
    - Required fields do not need extra text if the form pattern states fields are required unless marked optional.
    - Do not rely on an asterisk alone.
    - Do not rely on colour alone.
    - Do not hide required or optional status from assistive technology.
    - Keep wording consistent across all field types.
  groupedControls:
    required:
      legendSuffix: none
      fieldsetRequiredAttribute: false
      rules:
        - Fieldset does not support the native required attribute.
        - Required implementation remains with the child controls or grouped component.
        - Do not add "(required)" to the legend by default.
    optional:
      legendSuffix: "(optional)"
      rules:
        - Put "(optional)" in the visible legend.
        - The optional wording must be part of the group accessible name.
    mixed:
      legendSuffix: none
      rules:
        - Use when child controls have different requirement statuses.
        - Do not add "(required)" or "(optional)" to the group legend.
        - Child labels communicate their own statuses.
        - Do not describe the whole group as required or optional when that would be misleading.
  singleCheckbox:
    defaultSemanticState: optionalUnlessIndependentlyMandatory
    publicOptionalProperty: false
    publicFigmaProperties:
      - selection
      - state
      - description
      - labelText
      - descriptionText
      - errorText
    required:
      rules:
        - Native required means the standalone checkbox must be checked before the form is valid.
        - Use required only when the positive checked answer is genuinely mandatory.
        - Required standalone checkboxes do not need "(required)" by default.
        - Do not add "(optional)" to an independently mandatory Checkbox.
    optional:
      rules:
        - Being optional is normally the default semantic state for a Checkbox.
        - Optionality is not a separate native Checkbox state or public Checkbox property.
        - Optional standalone Checkboxes may include "(optional)" within the complete visible labelText when that guidance is useful.
        - Use the established lowercase wording "(optional)".
        - The suffix remains in the same visible text flow and accessible name as the rest of the label.
        - Do not create a separate marker layer, status column or alignment rule.
        - Production may author one complete string, append a textual suffix or use an inline textual span inside the associated label.
        - Keep Checkbox descriptions outside the label and associate them with aria-describedby.
        - Do not place descriptions, links, buttons or other interactive descendants inside the label.
        - Optional preference and consent checkboxes normally have no error merely because they remain unchecked.
  checkboxGroups:
    rules:
      - Fieldset owns group-level required, optional or mixed wording.
      - Do not repeat "(optional)" on every checkbox when the complete group is optional.
      - Do not use native required on one checkbox to mean at least one checkbox is required.
      - Applying required to every checkbox means every checkbox is individually mandatory.
      - Minimum, maximum and exact selection-count rules require group-level validation owned by Fieldset.

validation:
  inlineErrors:
    required: true
    order:
      - label
      - helperText
      - errorMessage
      - control
    orderScope: text-like-and-similar-single-controls
    orderExceptions:
      standaloneCheckbox:
        appliesTo:
          - single-checkbox
        overridesDefaultOrder: true
        sequence:
          - optionRow
          - individualError
        individualErrorContainer: checkboxRoot
        individualErrorOutsideLabel: true
        wholeGroupCheckboxErrorAssociation: group
        source: patterns.singleControl.orderExceptions.standaloneCheckbox
    rules:
      - Show the error close to the relevant field or group.
      - The error must be written in text.
      - The error should explain what went wrong.
      - Where possible, the error should explain how to fix it.
      - The error must be associated using aria-describedby.
      - Invalid controls should use aria-invalid="true".
      - A native fieldset never receives aria-invalid.
      - Error state must not rely on colour alone.
      - Inline errors must still appear when an error summary is used.

  groupErrors:
    contract:
      component: components/fieldset/fieldset.yaml
      section: errorAssociation
    visualPlacement:
      visibleSharedErrorCount: 1
      order:
        - legend
        - groupHelperText
        - groupErrorMessage
        - contentSlot
      rules:
        - Keep the shared error after helper text and before consumer content in both association modes.
        - Visual placement inside a Fieldset does not determine accessible ownership.
    wholeGroupInvalid:
      example: Radio or checkbox group where no option has been selected.
      errorAssociation: group
      association: fieldsetAriaDescribedBy
      fieldsetAriaInvalid: false
      summaryTarget: consumerDefinedDeterministicRelevantVisibleEnabledChild
      rules:
        - Use one group error when the grouped answer as a whole is missing or invalid.
        - Do not make the fieldset focusable.
        - Never apply aria-invalid to the fieldset.
        - A whole-group required failure remains group-associated.
        - For checkbox groups, do not turn every child checkbox boundary red for a shared group error.
        - For checkbox groups, do not repeat aria-invalid="true" or the Fieldset error ID on every child checkbox.
        - Children remain neutral unless they have a separate independently owned error.
    childFieldInvalid:
      example: Date of birth is missing a year.
      association: specificInvalidChildField
      summaryTarget: specificInvalidChildField
      rules:
        - When the child renders its own individual inline error, the affected child component owns that error.
        - Do not create a second vague group error merely because one child is invalid.
        - A consuming composite that renders one shared header error may instead use errorAssociation children when it identifies affected visible, enabled children.
    combinationInvalid:
      example: Date of birth is not a real date or is in the future.
      association: determinedByErrorAssociation
      defaultErrorAssociation: group
      summaryTargetByAssociation:
        group: consumerDefinedDeterministicRelevantVisibleEnabledChild
        children: consumerDefinedDeterministicAffectedVisibleEnabledChild
      rules:
        - Use one shared message when the error concerns the combined answer.
        - Use group when the error concerns the complete answer or affected children cannot be identified.
        - A consuming composite may use children when it identifies one or more affected visible, enabled children.
        - In children mode, only affected children reference the shared error and receive aria-invalid="true".
        - Never associate the same shared error with both the fieldset and children.
    describedByByAssociation:
      group:
        fieldset:
          - groupHelperText
          - groupErrorMessage
        childrenReferenceSharedError: false
      children:
        fieldset:
          - groupHelperText
        affectedChildrenReferenceSharedError: true
        unaffectedChildrenReferenceSharedError: false

errorSummary:
  componentContract:
    machineReadable: components/error-summary/error-summary.yaml
    humanReadable: components/error-summary/error-summary.md
  useWhen:
    - A failed submit has one or more user-correctable validation errors.
  semanticStructure: ul > li > a
  titleElement: h2
  rootTabIndex: -1
  documentTitlePrefix: "Error: "
  rules:
    - Place the error summary near the top of the page or form.
    - Use the same structure and behaviour for one error and several errors.
    - Render the error summary and every inline error before moving focus.
    - Move focus to the error summary exactly once for each failed-submission event.
    - Use an h2 heading such as “There is a problem” with the responsive H2 visual style.
    - List each distinct current user-correctable error once.
    - Sort errors by the document order of their related form questions and controls.
    - Each error must link to a visible, enabled control that the user can focus and correct.
    - Each field or group must still show its own inline error.
    - The error summary must not replace inline errors.
    - Preserve every entered value and selection when errors render and links are activated.
    - 'Prefix the existing document title once with "Error: " before moving focus.'
    - Do not accumulate the error prefix across repeated failed submissions.
    - Use focus-only announcement by default and prevent duplicates when optional role="alert", focus movement and inline error updates are combined.
    - The Figma error list uses the required native errorList slot.
    - Compose Error Summary / Item instances inside errorList instead of using count variants or one multiline text property.
  linkTargets:
    singleInputError: visibleEnabledInput
    textareaError: visibleEnabledTextarea
    selectError: visibleEnabledSelect
    standaloneCheckboxError: visibleEnabledCheckboxInput
    radioGroupError: firstRelevantVisibleEnabledRadio
    checkboxGroupError: firstRelevantVisibleEnabledCheckbox
    dateOfBirthSpecificError: visibleEnabledSpecificField
    dateOfBirthWholeDateError: firstRelevantVisibleEnabledFieldInGroup
    combinationError:
      group: consumerDefinedDeterministicRelevantVisibleEnabledChild
      children: consumerDefinedDeterministicAffectedVisibleEnabledChild
    addressSpecificError: visibleEnabledSpecificField
    addressWholeGroupError: firstRelevantVisibleEnabledFieldInGroup
  linkActivationRules:
    - Keep a real href fragment as a progressive-enhancement fallback.
    - Scroll the associated label into view for a single control, standalone Checkbox or specific multi-part field.
    - Scroll the associated legend into view for grouped controls and whole multi-part answers.
    - Move focus to the target control, using an activation handler when native fragment behaviour cannot provide the required context and focus.
    - Preserve the errorAssociation owner's established aria-describedby access to the inline error and useful hint.
    - Never move focus to Fieldset.
  groupedControlRules:
    - Summary links target a visible, enabled interactive child rather than a non-focusable fieldset.
    - Do not add tabindex to the fieldset merely to make it an error-summary target.
    - Inline group and child errors remain visible when an error summary is present.
    - Do not repeat a Fieldset-owned group error ID on every child merely to implement summary-link focus.
    - In children mode, preserve the shared error ID only on affected children and do not add it to unaffected children or the Fieldset.
    - Summary-link focus does not change the selected errorAssociation mode.

focusManagement:
  rules:
    - Do not move focus while the user is typing.
    - After a failed submit with one or more user-correctable validation errors, render the error summary and inline errors, then move focus to the error summary exactly once.
    - Do not refocus the error summary because validation state rerenders while the user corrects errors.
    - A later explicit submit that fails is a new event and moves focus to the error summary once again.
    - Give the error-summary root tabindex="-1" before programmatic focus so it is not in the normal Tab order.
    - tabindex="-1" may remain; if injected temporarily, keep it while the root has focus and remove it only after focus leaves.
    - Never use tabindex="0" for the error-summary root.
    - Move focus to an invalid control only after its error-summary link is activated.
    - When focus lands on an invalid control, preserve the selected errorAssociation owner's aria-describedby access to the inline error.
    - Focus must be visible.
    - Focus styling must not rely on colour alone.
    - When a field is both focused and in error, both states must remain clear.
    - The focus indicator must not be hidden by the error border.

disabledAndReadonly:
  disabled:
    behaviour:
      - Cannot be edited.
      - Cannot receive keyboard focus.
      - Is not submitted with the form.
    rules:
      - Disabled fields must still have a label.
      - Disabled fields must visually communicate that they are unavailable.
      - Disabled fields must not rely on colour alone.
      - Avoid making disabled content so low contrast that users cannot read it.
      - Do not use disabled fields when the value needs to be submitted.
  readonly:
    behaviour:
      - Cannot be edited.
      - Can receive focus.
      - Is submitted with the form.
    rules:
      - Use read-only instead of disabled when the value still needs to be submitted.
      - Read-only fields should have a distinct visual treatment from disabled fields.
      - Do not use disabled styling for read-only fields.
      - Read-only fields must still have a label.

inputAttributes:
  description: >
    Field components should use appropriate HTML attributes to help users enter
    information accurately, especially on mobile and touch devices.
  attributes:
    - type
    - inputmode
    - autocomplete
    - autocapitalize
    - enterkeyhint
  mappings:
    email:
      type: email
      autocomplete: email
    telephone:
      type: tel
      autocomplete: tel
    search:
      type: search
    url:
      type: url
      inputmode: url
    postcode:
      type: text
      autocomplete: postal-code
    dateOfBirthPart:
      type: text
      inputmode: numeric
    oneTimeCode:
      type: text
      inputmode: numeric
      autocomplete: one-time-code
    money:
      type: text
      inputmode: decimal
  avoidTypeNumberFor:
    - date of birth
    - phone number
    - card number
    - account number
    - sort code
    - National Insurance number
    - one-time code
    - reference number
    - postcode
    - values that may include leading zeros

