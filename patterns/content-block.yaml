pattern: Content Block

description: >
  Defines the relationship between headings, body text and optional action areas
  inside a content group.

purpose:
  - Create consistent content hierarchy
  - Control spacing between headings, prose and actions
  - Support readable and accessible content composition
  - Guide AI-generated layouts

tokens:
  heading:
    h1: typography.heading.h1
    h2: typography.heading.h2
    h3: typography.heading.h3
    h4: typography.heading.h4
    h5: typography.heading.h5
    h6: typography.heading.h6

  body:
    default: typography.body.default
    small: typography.body.small
    large: typography.body.large

  text:
    default: color.text.default

  spacing:
    headingToBody: spacing.content.headingToBody
    bodyToAction: spacing.content.bodyToAction
    paragraph: spacing.content.paragraph

  maxWidth:
    text: layout.container.maxWidth.text

headingUsage:
  description: >
    Content blocks may include headings, but heading level must follow the
    surrounding page structure. Heading visual style must also match the current
    breakpoint unless an exception is documented.

  breakpointStyleMapping:
    base: Use typography.heading.[level].base below breakpoint.md.
    md: Use typography.heading.[level].md from breakpoint.md and above.
    lg: Use typography.heading.[level].lg from breakpoint.lg and above.

  rules:
    - A content block directly inside a page section should not reset heading hierarchy.
    - If the content block sits under an H2 section, its heading is usually H3.
    - Use typography heading tokens as visual styles, not as the only source of semantic structure.
    - Responsive suffixes such as base, md and lg describe viewport sizing, not heading hierarchy.
    - Do not use H5 as a compact heading substitute when the content is structurally an H2 or H3.
    - Select the visual heading style using both semantic level and frame breakpoint.

headingSpacing:
  description: >
    Defines spacing between headings, descriptions and following content.

  headingToDescription:
    token: spacing.content.headingToBody
    usage: Use between a heading and its supporting description.

  descriptionToAction:
    token: spacing.content.bodyToAction
    usage: Use between descriptive text and a following action.

  paragraphSpacing:
    token: spacing.content.paragraph
    usage: Use between related paragraphs.

  sectionSpacing:
    token:
      base: spacing.section.base
      md: spacing.section.md
      lg: spacing.section.lg
    usage: Use between major documentation sections at the current breakpoint.

  stackSpacing:
    token: spacing.stack.lg
    usage: Use between grouped examples, cards or subsection blocks.

  rules:
    - Do not use arbitrary vertical gaps between headings and content.
    - Use headingToDescription when a heading is followed by explanatory text.
    - Use stack spacing for groups of related examples.
    - Use section spacing for major page regions.

layoutSelection:
  description: >
    Defines when to use flow-based layout versus grid-based layout in documentation
    and component examples.

  flexStyleLayout:
    useWhen:
      - Content should flow naturally in reading order.
      - Items are examples, cards, controls or text blocks.
      - Items may wrap or stack across viewport sizes.
      - The layout is primarily one-dimensional.
    examples:
      - Documentation sections
      - Button groups
      - QA playground examples
      - Icon rows
      - Form control groups

  gridStyleLayout:
    useWhen:
      - Content has a meaningful two-dimensional relationship.
      - Rows and columns need to be compared.
      - The layout represents a matrix, table or scale.
      - Alignment across both rows and columns is essential.
    examples:
      - Variant-by-state matrices
      - Breakpoint comparison tables
      - Token scale tables
      - Accessibility pass/fail matrices

  rules:
    - Prefer flex-style Auto Layout for normal documentation flow.
    - Use grid-style layout only when row and column relationships are meaningful.
    - Do not use grid simply to position unrelated content.
    - Reading order must remain logical when content is inspected or implemented.

textMeasure:
  description: >
    Defines maximum readable width for text inside content blocks.

  tokens:
    maxWidth: layout.container.maxWidth.text

  appliesTo:
    - Introductory text
    - Section descriptions
    - Explanatory prose
    - Help text blocks
    - Documentation notes
    - Accessibility guidance copy

  doesNotApplyTo:
    - Button labels
    - Short control labels
    - Icon names
    - Token names
    - Component examples
    - Visual sample areas

  rules:
    - Constrain prose and explanatory text to layout.container.maxWidth.text.
    - Do not stretch paragraphs to fill wide desktop containers.
    - Keep headings and their supporting descriptions aligned within the same readable text area where appropriate.
    - Use layout.container.maxWidth.text instead of arbitrary fixed widths.
    - Wider containers may be used for example grids, state matrices and component demonstrations.

  figmaRules:
    - Set section description text width to layout.container.maxWidth.text where the content is prose-like.
    - Use Fill container for the section frame, but constrain the text layer or text group.
    - Do not use full-width text layers for long descriptions on desktop frames.

  aiGenerationRules:
    - Before creating a prose text layer, check whether it should use layout.container.maxWidth.text.
    - Use text max width for documentation descriptions and guidance paragraphs.
    - Do not apply text max width to short labels or component samples.

structure:
  - Content block may contain a heading, body text and optional actions
  - Heading should appear before body text
  - Body text should use typography.body.default unless emphasis is needed
  - Long-form text should be constrained by layout.container.maxWidth.text
  - Actions should appear after body text with spacing.content.bodyToAction

spacingRules:
  - Use spacing.content.headingToBody between heading and body
  - Use spacing.content.paragraph between paragraphs
  - Use spacing.content.bodyToAction between body text and action area

accessibility:
  - Heading level should follow document structure
  - Visual heading style may differ from semantic HTML level when required
  - Text blocks should avoid overly long line lengths
  - Do not rely on colour alone to communicate emphasis
  - Heading levels should be nested properly to support assistive technologies
  - Heading text should be meaningful and descriptive of the content that follows

aiGenerationRules:
  - Use this pattern for hero copy, section introductions, cards with text, forms with intro text and empty states
  - Use semantic typography tokens only
  - Do not invent heading or paragraph spacing