pattern: Form Layout

relatedPatterns:
  - patterns/forms/form-field-patterns.yaml

description: >
  Defines spacing and structure for accessible forms, including labels, fields,
  helper text, validation messages and action areas.

purpose:
  - Provide consistent form layout
  - Support accessible label and helper text relationships
  - Ensure adequate spacing between fields and actions
  - Guide AI-generated form screens

tokens:
  label:
    default: typography.label.default

  body:
    default: typography.body.default
    small: typography.body.small

  text:
    default: color.text.default

  spacing:
    fieldInternalGap: spacing.stack.sm
    fieldGroupGap: spacing.stack.lg
    formSectionGap: spacing.section.base
    actionGap: spacing.inline.md
    bodyToAction: spacing.content.bodyToAction

  control:
    minBlockSize: size.control.minBlockSize.default
    paddingBlock: spacing.control.paddingBlock.default
    paddingInline: spacing.control.paddingInline.default

  border:
    interactive: color.border.interactive

formColumn:
  default:
    token: form.layout.column.maxWidth
    aliases: layout.container.maxWidth.narrow
    value: "{layout.container.maxWidth.narrow}"
    description: >
      Default maximum width for a single-column form. This aligns forms with
      the system narrow container width, which is intended for forms, dialogs
      and focused content areas.

    rules:
      - Use for most single-column forms.
      - Full-width inputs fill this form column, not the full page.
      - Do not set a separate max width on ordinary full-width text inputs.
      - Use shorter input width tokens only when the expected answer length is known.
      - Keep the form column close to the readable text measure so labels, helper text and errors remain easy to read.

  readableTextRelationship:
    token: layout.container.maxWidth.text
    value: "{layout.container.maxWidth.text}"
    description: >
      The readable prose width is slightly narrower than the default form column.
      Use it for long-form text, documentation notes and prose blocks. Do not
      use it as the default Text Input width directly.

  compact:
    token: form.layout.column.compactMaxWidth
    value: "{layout.container.maxWidth.text}"
    description: >
      Compact form column for short forms, authentication forms, small modals,
      drawers or card-based forms where a narrower layout is more appropriate.

  wide:
    token: form.layout.column.wideMaxWidth
    value: "{layout.container.maxWidth.default}"
    description: >
      Wider form layout for complex forms where the default narrow column is
      too constrained.
    rules:
      - Use only when the form genuinely needs more horizontal space.
      - Do not use wide forms just to fill available page space.
      - Consider whether the form should be split into sections before making the whole form wider.

structure:
  - Each field should have a visible label by default
  - If a visible label is not possible, follow patterns/forms/form-field-patterns.yaml for programmatic labelling
  - Helper text should appear near the associated field
  - Error messages should appear near the associated field
  - Related fields should be grouped with clear spacing
  - Primary actions should appear after the final field group

spacingRules:
  - Use spacing.stack.sm between label, helper text and field
  - Use spacing.stack.lg between field groups
  - Use spacing.content.bodyToAction before form actions
  - Use spacing.inline.md between inline actions

accessibility:
  - Every input must have an accessible label
  - Helper and error text must be programmatically associated where implemented in code
  - Interactive controls should meet minimum target sizing
  - Error states must not rely on colour alone

aiGenerationRules:
  - Do not create inputs without labels
  - Do not invent custom field spacing
  - Use status tokens for validation messaging
  - Use control sizing and spacing tokens for interactive elements
  - Follow patterns/forms/form-field-patterns.yaml for labels, legends, helper text, validation and fieldset behaviour