component: Breadcrumb
id: breadcrumb
version: 0.1.0
status: draft

phase:
  current: source-ready-for-review
  implementation: not-started
  figma: built-and-audited
  releaseReady: false

description: >
  Hierarchical navigation to ancestor pages. A compact overflowing trail can
  scroll horizontally or expand in place to expose the complete path.

relatedDocumentation:
  - components/breadcrumb/breadcrumb.md
  - components/breadcrumb/research.md
  - tokens/components/breadcrumb.json
  - components/link/link.yaml
  - components/button/button.yaml
  - accessibility/focus-indicators.yaml
  - patterns/component-documentation-page.yaml
  - tokens/figma/sync-contract.yaml

scope:
  includes:
    - Hierarchical ancestor links and an optional plain-text current page
    - Native horizontal scrolling with an explicit full-path layout toggle
    - Full labels, responsive text and a wrapping expanded path
    - Native slots, documentation and QA examples in Figma
  excludes:
    - History trails, Back to results, previous-page links and steppers
    - Ellipsis menus, omitted middle ancestors and label truncation
    - Disabled or loading items, icon-only labels and arbitrary interactive item content
    - Framework adapters and production JavaScript in this contract/Figma phase

acceptedDecisions:
  approvedBy: Richard
  date: '2026-10-10'
  hierarchy: Application-supplied site hierarchy; never browser or visit history.
  overflow: Native horizontal scrolling plus a Show full path layout option.
  expanded: Same ordered hierarchy wraps within the available width.
  longLabel: Wrap within the item in both presentations; do not shorten with ellipsis.
  currentPage: Optional plain text, never a self-link.
  home: Optional by page context, never automatically remove a meaningful ancestor.
  evidence: Baymard ecommerce findings inform the design; the full-path toggle is our accessibility enhancement.

publicApi:
  status: framework-neutral-contract
  label: {type: plain-text, default: Breadcrumb, localisable: true}
  ancestors:
    type: ordered-list
    required: true
    fields:
      id: Stable unique key.
      label: Required non-empty destination name; may be a concise editorial page label.
      href: Required native navigation destination.
      linkAttributes: Preserve applicable native anchor attributes and router integration.
    ordering: Highest included ancestor to immediate parent.
  currentPage:
    type: optional-plain-text
    rendering: Final non-interactive span with aria-current=page.
    absent: Final ancestor remains a link without aria-current.
  expanded:
    type: boolean
    default: false
    meaning: User preference for full-path layout, not whether ancestor links exist.
  onExpandedChange: Optional controlled-state callback; expansion must remain operable.
  showFullPathLabel: {type: plain-text, default: Show full path, localisable: true}
  showCompactPathLabel: {type: plain-text, default: Show compact path, localisable: true}
  validation:
    - Reject empty labels, empty ancestor hrefs and duplicate keys.
    - Omit the entire component when there are no ancestors; a current-page-only landmark adds no navigation.
    - Never derive ancestors from referrer, visit history, search terms or the route's raw URL segments.
    - Multi-category products use a valid application-supplied hierarchy; do not fabricate a path.
    - Do not duplicate the current page among its ancestors.

semantics:
  root: nav with a localised accessible name.
  list: ol containing li items in logical hierarchy order.
  ancestor: Native a element with a valid href and visible destination name.
  currentPage: Optional plain span with aria-current=page; never focusable.
  toggle: Native button type=button after the list, inside the navigation landmark.
  separators: Decorative slash before each item except the first; aria-hidden=true.
  rules:
    - Preserve list semantics when hiding markers; verify browser and screen-reader combinations.
    - Do not use menu, menubar, tree, tablist or stepper roles.
    - Do not mark the final ancestor current when the current page is omitted.
    - Keep page heading and primary navigation independent of this component.

content:
  - Preserve all meaningful ancestor levels in the selected hierarchy.
  - On mobile product pages Home may be omitted where the header has an obvious accessible home link.
  - The current product name may be omitted when the visible page heading identifies it.
  - These omissions are explicit page-level choices, not automatic mobile behaviour for all sites.
  - Keep concise labels descriptive and consistent with their destination; avoid ambiguous abbreviations.
  - Review excessive categorisation before adding display workarounds for very deep paths.

layout:
  selection: Based on actual available container width and content, not a fixed item count or device breakpoint.
  inline: Complete trail fits naturally; no toggle and no scrolling needed.
  scrollable:
    condition: Compact trail exceeds the available content width.
    behaviour: Native horizontal overflow confined to the list viewport, with no page-wide horizontal overflow.
    cue: Show full path remains visible outside the scroller; a partially visible following item also signals continuation where present.
    start: Logical beginning; do not automatically jump to the end or move focus on render.
    clipping: Clip only the scrolling viewport; reserve focus clearance inside it on all sides.
  expanded:
    behaviour: Same items and DOM order wrap into rows; all text stays within the available width.
    toggleLabel: Show compact path
    rule: Keep the separator with its following item; no standalone orphan separators.
  sizing:
    item: Natural width up to the available inner viewport width, then wrap the label.
    label: min-inline-size zero; overflow-wrap anywhere for unbreakable strings; automatic height.
    current: Same typography and wrapping geometry as links, without interaction styling.
    target: Minimum inline size size.target.minimum and minimum block size size.target.comfortable.
    row: Align items at the start so multi-line labels never overlap adjacent rows.
  responsive:
    - Inherit semantic typography from the parent Breakpoint mode; no breakpoint variant axis.
    - Re-evaluate overflow after container changes, fonts, translations and item updates.
    - Detect compact natural overflow independently of the expanded wrapped height/width.
    - Preserve the user's expanded preference across resizing.
    - If overflow disappears, remove an unfocused toggle; retain it until blur when it holds focus.
  rtl:
    - Use logical inline spacing and native direction; retain logical DOM hierarchy order.
    - Slash is direction-neutral. Localised names may use bidi isolation for mixed scripts.
    - Scroll and focus reveal follow the logical direction without assuming positive scrollLeft values.
  noJavaScript: Full path wraps by default; hide the toggle until enhancement is ready.
  print: Show the complete wrapping path and omit the presentation toggle.

layoutToggle:
  action: Change only presentation of the existing list; no navigation, duplicate links or hidden middle items.
  expandedState: aria-expanded reflects whether the full-path presentation is active.
  relationship: aria-controls references the stable list container ID.
  focus:
    - Keep focus on the same toggle element when its label changes.
    - Do not replace list nodes or reset link identity on expansion.
    - Reset scroll to logical start on deliberate collapse; ensure any focused link remains fully visible.
    - Toggle remains outside the clipped scroller and is keyboard reachable.
  announcements: Button name and expanded state communicate the change; no live-region repetition of the trail.
  motion: Instant layout change; no required animation or smooth scrolling.

keyboardAndFocus:
  tab: Native links in DOM order, then the overflow toggle if present; current text and separators are skipped.
  enter: Native link activation or button activation.
  space: Native button activation; retain native scrolling behaviour on links.
  arrows: No roving focus or custom arrow-key navigation.
  scroller: No extra tabindex is necessary when its native links provide access to every item.
  focus:
    - Scroll the focused anchor and its entire focus indicator into the visible viewport.
    - Preserve focus when hover or pressed states overlap.
    - Keep focus appearance outside layout flow so dimensions never shift.
    - Do not auto-focus or navigate on render, focus, scroll or pointerdown.
  pointer:
    - Use browser overflow scrolling; do not implement custom drag-to-scroll handlers.
    - A swipe, scroll gesture or cancelled pointer must not activate an ancestor.
    - Preserve native modifier clicks, link context menus and new-tab behaviour.

visuals:
  typography: typography.body.default with inherited responsive bindings.
  currentForeground: color.text.default
  separatorForeground: color.text.default
  linkForeground:
    Default: color.link.default.foreground
    Hover: color.link.hover.foreground
    Pressed: color.link.active.foreground
  linkDecoration: Underline in every state so navigation stays recognisable.
  focus:
    ring: color.interactive.focus.ring
    separator: color.interactive.focus.separator
    width: border.width.medium
    radius: radius.sm
    outset: 4px total from two 2px rings, using existing focus contract.
  spacing:
    itemGap: component.breadcrumb.spacing.itemGap
    separatorGap: component.breadcrumb.spacing.separatorGap
    paddingBlock: component.breadcrumb.spacing.paddingBlock
    paddingInline: component.breadcrumb.spacing.paddingInline
    rowGap: component.breadcrumb.spacing.rowGap
    controlGap: component.breadcrumb.spacing.controlGap
    focusInset: component.breadcrumb.spacing.focusInset
  toggle: Existing Button, Variant=text, Size=compact; allow localised labels to wrap.

