documentationExamples:
  - General page with Home, ancestors and a plain-text current page
  - Product category trail omitting Home and current product title by explicit page choice
  - Narrow overflowing trail with visible Show full path control
  - Expanded version of the same narrow trail
  - Long ancestor label and long current-page label

validation:
  target: WCAG 2.2 AA
  wcag: ['1.3.1', '1.3.2', '1.4.1', '1.4.3', '1.4.4', '1.4.10', '1.4.11', '1.4.12', '2.1.1', '2.1.2', '2.4.3', '2.4.4', '2.4.6', '2.4.7', '2.4.11', '2.5.2', '2.5.3', '2.5.8', '4.1.2']
  contrast: Normal text at least 4.5:1; focus ring at least 3:1 against adjacent separator/surface.
  targetSize: System choice of at least 44px block size and 24px inline size at the reference root size; not the inline-prose exception.
  reflow: Full-path view readable without horizontal scrolling at 320 CSS px and 400 percent zoom.
  textSpacing: No loss at line height 1.5, paragraph spacing 2em, letter spacing 0.12em and word spacing 0.16em.
  forcedColors: Preserve native links and a visible system-colour outline; box-shadow alone is insufficient.
  qaExamples:
    - 320px viewport with 16px page padding and complete expanded path
    - Compact overflowing path and focused item at the scroll boundary
    - Long individual labels in compact and expanded presentations
    - First and last link focus; hover and pressed plus focus
    - Base, md and lg typography modes
    - RTL logical order and mixed-direction labels
    - 200 percent text size and text-spacing stress cases
    - Same slot content and labels retained after changing Layout variants
  implementationAcceptance:
    - Named landmark, ordered list, silent separators and correct current-page semantics with screen readers
    - Native keyboard navigation, modifier activation and no scroll-induced navigation
    - Measured overflow, localisation and font-loading changes
    - Toggle name/state, stable focus and removal-after-blur on resizing
    - Expanded list reflows at 320px and 400 percent zoom
    - Long unbroken labels, 200 percent text resizing and all four text-spacing overrides
    - Native no-JavaScript and print full-path fallback
    - Visible focus in forced colours and at scroller boundaries
    - RTL scrolling and touch cancellation on real devices
  status: Contract and Figma evidence do not establish production browser or assistive-technology conformance.
  evidence:
    tokenBuild: 380 raw; 308 Tokens Studio; 24 mapped responsive groups; zero unmapped groups or broken retained aliases.
    metadata: Seven unique global spacing aliases match canonical scopes and Web syntax; Breakpoint modes unchanged.
    inventory: Seven masters across two component sets and one standalone Current component; 14 documented root instances.
    typography: 222 text nodes use shared styles; 12 deliberate text overrides are confined to labelled 200-percent and text-spacing QA examples.
    layout: 71 label targets checked without text overflow or undersized target dimensions.
    preservation: Scrollable-to-Expanded and reverse preserve slot content; all three link states preserve Label and Focus.
    visual: Masters, documentation, accessibility notes, narrow labels and text-stress compositions reviewed.
    contrastOnWhite:
      body: 7.00
      defaultLink: 4.52
      hoverLink: 7.00
      pressedLink: 10.87
      focusRing: 4.52
    pending: Browser implementation, RTL, screen readers, native scrolling, touch cancellation, 400-percent zoom, word spacing and forced colours.


