validation:
  examples:
    - Documentation primary navigation with visible and expandable groups
    - B2B workspace primary navigation and distinctly named section navigation
    - Flat links, mixed groups, explicit optional heading levels and one current link
    - Drawer keyboard boundary, inertness, Close/Escape/backdrop and scroll/focus restoration
    - Accepted, failed, modified and same-destination navigation
    - Desktop/mobile resize while a link, Menu trigger or open drawer owns focus
    - State preservation across placement; single rendered tree and unique IDs
    - 320px RTL by test-only direction setting, long labels, text scaling/spacing, print, no-JavaScript and forced colours
    - Header placement and focus return for primary drawer triggers; local section/in-flow controls
    - Zero core nav padding/border; desktop separator only in page composition
    - Current default/hover/pressed filled palette with no left bar; neutral Accordion states
    - Removed uncontrolled group state is discarded; open inline resize protects focus and returns to persistent layout; empty preview presentation uses drawer default
    - Optional nav aria-label absent by default, distinct names when provided, independent named drawer title
    - Both Accordion levels remain independent; drawer header/label alignment and bounded vertical gap
  releaseGates:
    - Richard local design/API review accepted on 27 October 2026
    - Source merged through PR 49; GitHub CI passed
    - Figma construction and structural/visual comparison completed
    - Manual assistive-technology, zoom and real-device acceptance

