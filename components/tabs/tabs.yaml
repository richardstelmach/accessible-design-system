      url: https://www.w3.org/WAI/ARIA/apg/patterns/tabs/examples/tabs-automatic/
    - name: W3C APG Manual Tabs Example
      url: https://www.w3.org/WAI/ARIA/apg/patterns/tabs/examples/tabs-manual/
    - name: GOV.UK Tabs
      url: https://design-system.service.gov.uk/components/tabs/
    - name: W3C WCAG 2.2
      url: https://www.w3.org/TR/WCAG22/
    - name: W3C Target Size Minimum
      url: https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum.html
    - name: W3C Reflow
