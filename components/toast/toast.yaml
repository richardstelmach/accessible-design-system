acceptanceCriteria:
  - Exactly eight Toast variants and three close-control variants; no timed or nondismissible option.
  - Four status pairings and registered icons match Alert; six component geometry aliases carry exact scopes and Web syntax.
  - Text meets 4.5 to 1 contrast; meaningful icons and focus indicators meet applicable 3 to 1 contrast requirements.
  - Close remains reachable, named, enabled and at least 44 by 44px at reference size.
  - All visible content wraps and grows; status and close icons remain separate from text.
  - One announcement owner selects status or alert independently from severity, without announcing controls or prior messages.
  - No focus theft on arrival; predictable focus recovery only when removing the focused Toast.
  - No timeout, silent replacement or capacity eviction; notification-region access and reflow are available.
  - Runtime acceptance includes keyboard, repeated messages, bursts, modal scope, focus removal, scrolling, zoom, RTL and forced colours.
  - Test NVDA with Firefox/Chrome, JAWS with Chrome/Edge and VoiceOver with Safari on supported platforms before release.
  - Figma and token checks do not claim browser or screen-reader certification.

