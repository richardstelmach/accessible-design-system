testing:
  automated:
    - Native input, button, label and describedby semantics.
    - Native disabled boundary states and Tab sequences.
    - Required, range, step and bad-input validation.
    - Form submission inclusion and disabled-input omission.
    - Button-origin status updates without direct-input duplication.
    - Boundary-origin status updates when focus does not move to numericInput.
    - Focus fallback after a button becomes disabled at a boundary.
    - Retained invalid values after validation failure.
    - Decimal stepping and floating-point regression coverage.
  manual:
    - Keyboard-only operation including every boundary sequence.
    - Browser focus after dynamically disabling the activated button.
    - Screen-reader labels, values, range, disabled state and announcement duplication.
    - Pointer and touch operation.
    - 200 percent text resize, 400 percent zoom and text-spacing overrides.
    - Forced-colours and high-contrast behaviour.
    - Long label, helper and error wrapping.
    - Narrow-container layout without clipping or reordered controls.

aiGenerationRules:
  - Use Stepper only for a mathematical numeric quantity.
  - Use a native editable input type="number" in the centre.
  - Use native Minus and Plus buttons in fixed Minus, numeric input, Plus order.
  - Give icon-only buttons action-plus-subject accessible names.
  - Keep icon graphics decorative.
  - Use native disabled, never aria-disabled, for unavailable boundary buttons.
  - Keep valid minimum and maximum values free of error treatment.
  - Use the documented focus fallback only after an activated button becomes disabled and focus would otherwise be lost.
  - Do not duplicate a button-origin status announcement after focus moves to numericInput.
  - Do not add a public Stepper Group, readonly Stepper or custom ARIA spinbutton.
  - Reuse existing form, Button and Text Input width tokens.
  - Do not create Stepper-specific tokens without a documented token gap.
  - Do not edit Figma or Tokens Studio as part of GitHub-only implementation.
