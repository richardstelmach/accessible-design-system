        shellDetached: false
        itemDetached: false
        listLayoutPreserved: true
    - id: duplicate-default-item
      scenario: Designer duplicates the default Error Summary / Item.
      expected:
        itemCount: 2
        errorTextOverridesIndependent: true
        shellDetached: false
    - id: delete-item
      scenario: Designer removes one item from a list that contains more than one.
      expected:
        remainingItemsPreserved: true
        listGapPreserved: true
        shellDetached: false
    - id: reorder-items
      scenario: Designer reorders Error Summary / Item children.
      expected:
        visualOrderChanged: true
        itemOverridesTravelWithItems: true
        slotValid: true
        shellDetached: false
    - id: edit-every-error-text
      scenario: Designer edits errorText independently on every item.
      expected:
        everyItemIndependentlyEditable: true
        bulletIncludedInErrorText: false
        neighbouringOverridesReset: false
        listStylePreserved: true
    - id: attempt-remove-final-item
      scenario: Designer attempts to remove the final required item.
      expected:
        emptyListValid: false
        deletionBlockedWhenSupported: true
        invalidAdvisoryRequiredOtherwise: true
