        slotContentPreserved: true
        itemOrderPreserved: true
        errorTextOverridesPreserved: true
        shellDetached: false
    - id: description-content-preservation
      scenario: Designer toggles description on and off.
      expected:
        slotContentPreserved: true
        itemOrderPreserved: true
        errorTextOverridesPreserved: true
        hiddenDescriptionGap: false
        shellDetached: false
    - id: long-wrapped-errors
      scenario: Several errorText values wrap onto multiple lines.
      expected:
        linkTextWraps: true
        itemHeightAutomatic: true
        clipping: false
        overlap: false
    - id: container-320px
      scenario: Error Summary appears in a 320px-wide container.
      expected:
        containerWidthPx: 320
        horizontalOverflow: false
        titleWraps: true
        descriptionWrapsWhenVisible: true
        errorLinksWrap: true
        clipping: false
    - id: multiline-bullet-alignment
      scenario: An error link wraps across multiple lines.
      expected:
        markerAlignedToFirstLine: true
        markerVerticallyCenteredAgainstWholeItem: false
        markerRepeatedOnWrappedLines: false
    - id: no-detachment
      scenario: Designer completes every supported list-authoring operation.
      expected:
        errorSummaryDetached: false
        errorItemDetached: false
        componentPropertiesRemainAvailable: true
    - id: text-edit-preserves-list-style
      scenario: Designer edits errorText from the properties panel.
      expected:
        listStylePreserved: true
        markerLayerPreserved: true
        markerEnteredAccessibleName: false
        combinedRichTextPropertyUsed: false
    - id: no-raw-styling
      scenario: Default and focus variants, slot and item are audited for variables and styles.
