        targetEnabled: true
        associatedLabelScrolledIntoView: true
        targetReceivesFocus: true
        inlineErrorDescribedByAfterFocus: true
    - id: radio-group-target
      scenario: User activates a summary link for a Radio group error.
      expected:
        target: first-relevant-visible-enabled-radio
        legendScrolledIntoView: true
        targetReceivesFocus: true
        fieldsetReceivesFocus: false
        fieldsetTabindexAdded: false
        groupInlineErrorProgrammaticallyAvailable: true
    - id: checkbox-group-target
      scenario: User activates a summary link for a Checkbox group error.
      expected:
        target: first-relevant-visible-enabled-checkbox
        legendScrolledIntoView: true
        targetReceivesFocus: true
        fieldsetReceivesFocus: false
        fieldsetTabindexAdded: false
        groupInlineErrorProgrammaticallyAvailable: true
    - id: multipart-specific-target
      scenario: User activates a summary link for one invalid part of a multi-part answer.
      expected:
