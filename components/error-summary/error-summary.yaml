        slotWrapperInDom: false
        itemComponentWrapperInDom: false
    - id: preferred-instance-only
      scenario: The errorList slot's recommendations and restrictions are audited.
      expected:
        onlyPreferredInstance: Error Summary / Item
        enforcementEnabledWhenSupported: true
        arbitraryContentValid: false
        multilineTextFallbackAllowed: false
  accessibilityCases:
    - id: one-error-failed-submit
      scenario: Failed submission returns one user-correctable validation error.
      expected:
        summaryRendered: true
        itemCount: 1
        semanticStructure: ul > li > a
        rootReceivesFocus: true
        focusMoveCount: 1
        focusVisible: true
        everyInlineErrorVisible: true
    - id: several-errors-failed-submit
      scenario: Failed submission returns several user-correctable validation errors.
      expected:
        summaryRendered: true
        everyDistinctErrorListedOnce: true
        semanticStructure: ul > li > a
        rootReceivesFocus: true
        focusMoveCount: 1
        everyInlineErrorVisible: true
    - id: no-focus-steal-while-typing
      scenario: User corrects an error.
      expected:
        focusMovesUnexpectedly: false
    - id: rerender-does-not-refocus
      scenario: Validation state rerenders during the same failed-submission event.
      expected:
        additionalSummaryFocusMoves: 0
        currentUserFocusPreserved: true
        unchangedAlertRebuilt: false
    - id: repeated-submit-refocuses-once
      scenario: User explicitly submits again and the later submission also fails.
      expected:
        newFailedSubmissionEvent: true
        focusMovesForNewEvent: 1
        errorTitlePrefixCount: 1
    - id: tabindex-lifecycle
      scenario: Error Summary receives programmatic focus.
      expected:
        tabindexBeforeFocus: -1
        normalTabStop: false
        tabindexZeroUsed: false
        temporaryTabindexRemovedWhileFocused: false
    - id: page-title-prefix
      scenario: Failed submission renders Error Summary and later repeats.
      expected:
        prefix: "Error: "
        prefixAppliedBeforeFocus: true
        prefixCount: 1
        originalTitleRestorable: true
    - id: document-order-and-deduplication
      scenario: Validators return errors out of document order and emit one issue twice.
      expected:
        summaryOrder: corresponding-form-control-document-order
        duplicateSummaryItems: 0
        everyDistinctCurrentErrorPresent: true
    - id: values-and-selections-preserved
      scenario: Failed submission, corrective rerender and summary-link activation occur.
      expected:
        textValuesPreserved: true
        textareaValuesPreserved: true
        selectValuesPreserved: true
        radioSelectionsPreserved: true
        checkboxSelectionsPreserved: true
        multipartValuesPreserved: true
    - id: single-control-target
      scenario: User activates a summary link for a single input, Textarea or Select.
      expected:
        hrefFragmentResolves: true
