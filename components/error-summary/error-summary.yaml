        targetReceivesFocus: true
        fieldsetReceivesFocus: false
        inlineErrorDescribedByAfterFocus: true
    - id: multipart-whole-target
      scenario: User activates a summary link for a whole-answer or combination multi-part error.
      expected:
        target: first-relevant-visible-enabled-child
        legendScrolledIntoView: true
        targetReceivesFocus: true
        fieldsetReceivesFocus: false
        groupInlineErrorProgrammaticallyAvailable: true
    - id: inline-errors-remain
