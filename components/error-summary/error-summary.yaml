implementationRules:
  html:
    - Use a real h2, unordered list, list items and anchors.
    - After a failed submit with one or more user-correctable errors, render Error Summary and every inline error, then focus the summary once.
    - Give the Error Summary root tabindex="-1" before programmatic focus.
    - Keep tabindex="-1" permanently or, if it is injected temporarily, remove it only after focus leaves.
    - Use role="alert" only as part of a tested strategy that does not duplicate the focus announcement or inline messages.
    - Give every error link a fragment target that exists and is unique.
    - Make every target a visible, enabled control.
    - On link activation, scroll the associated label or legend into view and focus the target control.
    - Never focus Fieldset.
    - Preserve the control's or owning Fieldset's aria-describedby access to the inline error.
    - Keep inline errors visible and associated with their controls.
    - Preserve entered values and selections.
    - Sort errors by corresponding form-control document order and remove duplicate summary items.
    - 'Prefix the existing document title once with "Error: " before moving focus.'
    - Do not add semantic wrappers for Figma slots or supporting components.
    - Do not add the visual bullet to anchor text or aria-label.
  css:
    - Use form.errorSummary tokens for the shell.
    - Use responsive heading and body typography tokens.
    - Use documented spacing and focus tokens.
    - Preserve native list semantics if list-marker presentation is customised.
    - Allow links and the shell to grow in block size.
    - Preserve visible focus and the error boundary in forced-colours mode.
    - Prevent focused content from being obscured by sticky or overlapping author-created content.
    - Do not use fixed heights, arbitrary item widths, clipping or raw values.
  figma:
    - Build errorList as a required native Figma Slot property.
    - Put one Error Summary / Item instance in the slot by default.
    - Configure Error Summary / Item as the only preferred instance.
    - Enable preferred-instance enforcement when supported.
    - Preserve slot content across state changes and description toggles.
    - Use typography/heading/h2 and typography/body/default styles that inherit the parent frame's Breakpoint mode.
    - Do not create breakpoint-suffixed text styles or responsive component variants.
    - Do not detach Error Summary or Error Summary / Item for routine authoring.

aiGenerationRules:
  - Require Error Summary after a failed submit with one or more user-correctable validation errors.
  - Keep every inline error and move focus to Error Summary exactly once after rendering.
  - Do not replace the one-error summary with direct-to-field focus.
  - Generate one public Error Summary component and one supporting Error Summary / Item Figma subcomponent.
  - Use the exact public Error Summary property names state, description, titleText, descriptionText and errorList.
  - Use only errorText as the public property on Error Summary / Item.
  - Use a required native slot for errorList.
  - Add, duplicate, remove and reorder Error Summary / Item instances through the slot.
  - Keep at least one item and impose no maximum item count.
  - Recommend only Error Summary / Item in the slot and enforce that restriction when supported.
  - Do not create error-count properties, count variants or duplicate shells.
  - Do not create one combined multiline errorsText property.
  - Do not expose the bullet marker as editable text.
  - Do not include a bullet character in errorText.
  - Preserve slot content when state or description changes.
  - Map production output to ul > li > a.
  - Render the title as h2 while keeping heading level out of the Figma API.
  - Use one Breakpoint-mode semantic Figma text style for each text role instead of breakpoint variants.
  - Sort errors by form document order, remove duplicate items and preserve values and selections.
  - Target visible, enabled controls; scroll their label or legend into view; never focus Fieldset.
  - Prefix the document title once and prevent duplicate alert, focus and inline-error announcements.
  - Use semantic tokens and report missing token needs instead of inventing raw styling.

acceptanceCriteria:
  - One public Error Summary component is defined.
  - Error Summary / Item is a published supporting Figma subcomponent grouped with Error Summary.
  - Error Summary / Item is documented as "Use only inside the Error Summary errorList slot".
  - Error Summary / Item is not treated as a standalone product-level component.
  - Error Summary public properties are exactly state, description, titleText, descriptionText and errorList.
  - state supports default and focus.
  - description defaults to false.
  - titleText defaults to "There is a problem".
  - The production title is semantically h2 and uses the responsive H2 visual style.
  - errorList is a required native Figma Slot property.
  - errorList maps conceptually to ul.
  - errorList uses vertical Auto Layout and contains one default item.
  - errorList has minimum child guidance of one and no maximum.
  - Zero error items is invalid.
  - Inserted items fill the available width.
  - Items can be added, duplicated, removed and reordered without detaching the shell.
  - Slot content survives state changes and description toggles.
  - Error Summary / Item is the only preferred instance and enforcement is enabled when supported.
  - Error Summary / Item exposes only errorText.
  - errorText contains actionable link wording without a bullet character.
  - Error Summary / Item uses horizontal Auto Layout.
  - The bullet marker is fixed, presentational and aligned with the first line.
  - Link text fills available width, has automatic height and wraps naturally.
  - No item has a fixed height, arbitrary width or clipping.
  - No error-count property, count variant, combined errorsText property or editable bullet property exists.
  - Figma QA explicitly covers one, two, five and ten items.
  - Figma QA explicitly covers add, duplicate, delete, reorder and independent text edits.
  - Figma QA explicitly covers attempted removal of the final item.
  - Figma QA explicitly covers state and description content preservation.
  - Figma QA explicitly covers long errors, a 320px container and multiline bullet alignment.
  - Figma QA explicitly covers no detachment, list-style preservation and no raw styling.
  - Figma typography uses one semantic style per role and inherits base, md and lg values from the parent Breakpoint mode.
  - Production semantic handoff remains ul > li > a.
  - One error and several errors use identical semantic structure and behaviour.
  - Every failed submit with one or more user-correctable errors renders Error Summary and all inline errors.
  - Focus moves to Error Summary exactly once per failed-submission event and corrective rerenders do not steal focus.
  - A later explicit failed submit moves focus to Error Summary exactly once again.
  - tabindex="-1" keeps the root out of the normal Tab order and any temporary attribute is removed only after focus leaves.
  - 'The existing document title receives one non-accumulating "Error: " prefix before focus.'
  - Error items follow form document order and duplicate current issues are listed once.
  - All entered values and selections survive failed rendering, rerenders and link activation.
  - Every link targets a visible, enabled control, scrolls its label or legend into view and moves focus to that control.
  - Link targeting covers single controls, Radio groups, Checkbox groups, standalone Checkbox and specific or whole multi-part answers.
  - Fieldset never receives focus or tabindex for summary targeting.
  - The target control or owning Fieldset retains aria-describedby access to the inline error.
  - QA explicitly covers long text, 320px width, 200 percent text resize, 400 percent zoom/reflow and text spacing.
  - QA explicitly covers forced colours, screen-reader semantics, one announcement and focus not obscured.
  - Error Summary supplements rather than replaces inline errors.
